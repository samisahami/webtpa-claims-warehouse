name: dbt CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Create dbt profiles
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml << 'EOF'
          webtpa_claims:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: mrvdjdj-abc66703
                user: SAMISAHAMI
                password: "${{ secrets.SNOWFLAKE_PASSWORD }}"
                role: ACCOUNTADMIN
                database: WEBTPA_CLAIMS_DB
                warehouse: WH_DBT_DEV
                schema: DBT_DEV
                threads: 1
          EOF
          
      - name: Debug dbt connection
        working-directory: webtpa_claims
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt
        run: dbt debug

      - name: Run dbt seed
        working-directory: webtpa_claims
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt
        run: dbt seed

      - name: Run dbt models
        working-directory: webtpa_claims
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt
        run: dbt run

      - name: Run dbt tests
        working-directory: webtpa_claims
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt
        run: dbt test