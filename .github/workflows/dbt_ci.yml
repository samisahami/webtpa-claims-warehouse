name: dbt CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Write private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_private_key.pem
          chmod 600 /tmp/snowflake_private_key.pem

      - name: Create dbt profiles
        run: |
          mkdir -p /home/runner/.dbt
          cat > /home/runner/.dbt/profiles.yml << 'EOF'
          webtpa_claims:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: MVRDJDJ-ABC66703
                user: SAMISAHAMI
                private_key_path: /tmp/snowflake_private_key.pem
                role: ACCOUNTADMIN
                database: WEBTPA_CLAIMS_DB